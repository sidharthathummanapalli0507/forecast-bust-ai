services:
  # FastAPI AI/ML Forecast Bust Detection Backend Service
  - type: web
    name: forecast-bust-engine
    runtime: python
    plan: free
    rootDir: Weather/bust-engine
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PORT
        value: 8001
      - key: PYTHON_VERSION
        value: 3.11.9

  # Express.js UI & Web Dashboard Server
  - type: web
    name: forecast-bust-web
    runtime: node
    plan: free
    rootDir: Weather
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: PORT
        value: 3000
      - key: BUST_ENGINE_URL
        value: https://forecast-bust-engine.onrender.com
